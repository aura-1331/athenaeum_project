name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"

      - name: Wait until Render runs this commit
        run: |
          for i in $(seq 1 40); do
            sha=$(curl -s --max-time 60 https://athenaeum-api.onrender.com/health/version | jq -r .commit 2>/dev/null || echo none)
            echo "Try $i | Live: $sha | Expected: $GITHUB_SHA"
            [ "$sha" = "$GITHUB_SHA" ] && exit 0
            sleep 15
          done
          echo "Deploy never went live"
          exit 1

      - name: CORS check for every client
        run: |
          fail=0
          for o in https://athenaeum-project.vercel.app https://tauri.localhost http://tauri.localhost; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -X OPTIONS \
              https://athenaeum-api.onrender.com/token \
              -H "Origin: $o" -H "Access-Control-Request-Method: POST")
            echo "$o -> $code"
            [ "$code" = "200" ] || fail=1
          done
          exit $fail
name: Release

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  test-backend:
    runs-on: ubuntu-latest
    env:
      ATHENAEUM_ENV: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r library_api/requirements.txt pytest httpx
      - name: Create throwaway test keys
        working-directory: library_api
        run: |
          openssl genrsa -out private.pem 2048
          openssl rsa -in private.pem -pubout -out public.pem
      - run: python -m pytest tests -v
        working-directory: library_api

  test-frontend:
    runs-on: ubuntu-latest
    env:
      PUPPETEER_SKIP_DOWNLOAD: "true"
    defaults:
      run:
        working-directory: library_tauri
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: library_tauri/package-lock.json
      - run: npm ci
      - run: npm run test:run -- --passWithNoTests
      - run: npm run build

  deploy-backend:
    needs: [test-backend, test-frontend]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"

      - name: Wait until Render runs this commit
        run: |
          for i in $(seq 1 40); do
            sha=$(curl -s --max-time 60 https://athenaeum-api.onrender.com/health/version | jq -r .commit 2>/dev/null || echo none)
            echo "Try $i | Live: $sha | Expected: $GITHUB_SHA"
            [ "$sha" = "$GITHUB_SHA" ] && exit 0
            sleep 15
          done
          echo "Deploy never went live"
          exit 1

      - name: CORS check for every client
        run: |
          fail=0
          for o in https://athenaeum-project.vercel.app https://tauri.localhost http://tauri.localhost; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -X OPTIONS \
              https://athenaeum-api.onrender.com/token \
              -H "Origin: $o" -H "Access-Control-Request-Method: POST")
            echo "$o -> $code"
            [ "$code" = "200" ] || fail=1
          done
          exit $fail